[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transverse-jet"
version = "0.1.0"
description = "Local, unforced jet-in-crossflow research prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.12", "matplotlib>=3.8", "pyamg>=5.2", "numba>=0.61"]

[project.optional-dependencies]
test = ["pytest>=8"]
mpi = ["mpi4py>=4.1", "petsc4py>=3.25"]
visualization = ["scikit-image>=0.25"]

[project.scripts]
transverse-jet = "jetflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
